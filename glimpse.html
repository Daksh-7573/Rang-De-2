<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glimpse of Season 1</title>
 <link rel="stylesheet" href="styles_glimpse.css">
</head>

<body>
    <div class="mobile-message">
        <h1>Please view on larger screen</h1>
    </div>
 <div class="text-above">
        <h1>Best Drawings of Season 1</h1>
    </div>

    <div class="carousel-container">
        <button class="nav left" aria-label="Previous image">&#10094;</button>
        <div class="carousel">
        </div>
        <button class="nav right" aria-label="Next image">&#10095;</button>
    </div>

    <div class="text-below">
        <h1>Theme: Save Earth</h1>
    </div>
<script>
    const totalImages = 22;
    const carousel = document.querySelector('.carousel');
    const leftBtn = document.querySelector('.nav.left');
    const rightBtn = document.querySelector('.nav.right');

    // Load all images initially
    for (let i = 1; i <= totalImages; i++) {
        const img = document.createElement('img');
        img.src = `Assets/Slide_Show/img_${i}.jpg`;
        img.alt = `Image ${i}`;
            if (i === 1) {
                img.classList.add('main');
            } else {
                img.classList.add('side');
            }
        carousel.appendChild(img);
        }

    let currentIndex = 0;
    let isAnimating = false;

    function updateClasses() {
        const imgs = carousel.querySelectorAll('img');
        imgs.forEach((img, idx) => {
        img.classList.remove('main', 'side');
        if (idx === 1) {
            img.classList.add('main');
        } else {
            img.classList.add('side');
        }
    });
    }

    function slideNext() {
        if (isAnimating) return;
            isAnimating = true;
            carousel.style.transition = 'transform 0.5s ease';
            carousel.style.transform = 'translateX(-33.33%)';

            carousel.addEventListener('transitionend', function handler() {
            carousel.style.transition = 'none';
            carousel.style.transform = 'translateX(0)';
            carousel.appendChild(carousel.firstElementChild);
            updateClasses();
            isAnimating = false;
            carousel.removeEventListener('transitionend', handler);
        });
    }

    function slidePrev() {
        if (isAnimating) return;
            isAnimating = true;
            carousel.style.transition = 'none';
            carousel.insertBefore(carousel.lastElementChild, carousel.firstElementChild);
            carousel.style.transform = 'translateX(-33.33%)';

            requestAnimationFrame(() => {
            requestAnimationFrame(() => {
            carousel.style.transition = 'transform 0.5s ease';
            carousel.style.transform = 'translateX(0)';
        });
    });

    carousel.addEventListener('transitionend', function handler() {
    updateClasses();
    isAnimating = false;
    carousel.removeEventListener('transitionend', handler);
    });
    }

    leftBtn.addEventListener('click', slidePrev);
    rightBtn.addEventListener('click', slideNext);

    updateClasses();
</script>

</body>
</html>
